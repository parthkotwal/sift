[project]
name = "sift"
version = "0.0.0"
description = "Two-stage retrieval and ranking service over the Yelp Open Dataset."
readme = "README.md"
requires-python = ">=3.12"
# What a serving container needs, and nothing more. `lightgbm` is here because the
# ranker runs at request time (D27); `duckdb` because the online store projects the
# registry's SQL expressions on the serving path. The training-only libraries moved to
# the `training` group below — asserting that the API does not *import* them is not the
# same as not *installing* them, and only the second one shrinks the image.
dependencies = [
    "boto3>=1.40,<2",
    "duckdb>=1.5.5",
    "fastapi>=0.115",
    "lightgbm>=4.7.0",
    "numpy>=2.5.1",
    "redis>=5.2",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
# Dev tooling. Runtime ML deps (implicit, LightGBM, ...)
# are added at the build step that first needs them — every dep pays rent.
dev = [
    "boto3-stubs[s3]>=1.40,<2",
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "httpx>=0.28",
]

# Fitting the artifacts, never reading them. `implicit` fits the ALS factors (D25) and
# the yearly slices (D27); `torch` trained the two-tower that lost its gate (D26) and is
# kept only so that rejection stays reproducible. Serving reads the .npy files both
# produced and calls neither library.
#
# `scipy` is not listed: LightGBM depends on it, so it arrives with a required serving
# dependency. The boundary drawn here is Sift's own imports, not its libraries'.
training = [
    "implicit>=0.7.2",
    "torch>=2.13.0",
]

[tool.uv]
# Local work is unchanged: `uv sync` still installs everything, so training, tests and
# the notebook-style modules all run. A serving image opts out with
# `uv sync --no-default-groups --no-dev`, which is the only place the split pays off.
default-groups = ["dev", "training"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Sensible, non-noisy default set; expand deliberately, not reflexively.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
